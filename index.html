<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon coffre</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c1320">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<style>
:root{--bg:#e8ecf1;--card:#f8fafc;--panel:#dde4ec;--ink:#13202f;--mute:#586a7e;--line:#cdd6e0;--acc:#1c3556;--acc-ink:#fff;--brass:#a06c14;--bad:#a8231b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1320;--card:#142033;--panel:#1b2c45;--ink:#e8eef6;--mute:#8da0b8;--line:#263850;--acc:#e0b04f;--acc-ink:#1a1405;--brass:#e0b04f;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0c1320;--card:#142033;--panel:#1b2c45;--ink:#e8eef6;--mute:#8da0b8;--line:#263850;--acc:#e0b04f;--acc-ink:#1a1405;--brass:#e0b04f;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Sora,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 18px 40px}
.hasnav main{padding-bottom:120px}
h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:-.02em;line-height:1.2}
p{margin:0 0 16px;color:var(--mute)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
button{border:0;border-radius:14px;padding:14px 18px;background:var(--acc);color:var(--acc-ink);font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
button.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.pwwrap{position:relative;margin-bottom:10px}
.pwwrap input{margin-bottom:0;padding-right:52px}
.pwwrap .eye{position:absolute;right:4px;top:4px;bottom:4px;width:44px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--mute);border-radius:10px}
.err{color:var(--bad);min-height:22px;margin:0 0 8px}
.note{font-size:14px;color:var(--mute)}
textarea{min-height:90px}
.entry{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.dial{display:block;margin:6px auto 14px}
.dial+h1,.dial+h1+p{text-align:center}
.ring{transform-origin:60px 60px;transition:transform .7s cubic-bezier(.3,.8,.3,1)}
.spin .ring,.dial.spin .ring{transform:rotate(200deg)}
@media (prefers-reduced-motion:reduce){.ring{transition:none}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;margin:-20px -18px 14px;padding:14px 18px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em}
.ico{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:50%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:128px;padding:16px;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:22px;font-weight:400}
.tile b{font-size:17px;margin-top:auto}
.tile small{color:var(--mute);font-size:13px}
.badge{width:44px;height:44px;border-radius:14px;background:var(--panel);color:var(--brass);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ent{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.eh{display:flex;align-items:center;gap:12px}
.eh b{font-weight:600}
.val{margin:10px 0 12px;word-break:break-word;white-space:pre-wrap;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:transparent;color:var(--mute);font-size:12px;font-weight:600;border-radius:12px}
.nb.on{color:var(--ink)}
.nb.on svg{color:var(--brass)}
.nb.fab svg{width:40px;height:40px;padding:8px;margin-top:-20px;background:var(--acc);color:var(--acc-ink);border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.nb.fab.on svg{color:var(--acc-ink)}
.hasnav #bk{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const CATS=["Identité","Santé","Contacts","Documents","Finances","Notes"];
const SUG={
"Identité":["Nom complet","Nom de naissance","Date de naissance","Lieu de naissance","Nationalité","Adresse actuelle","Numéro de sécurité sociale","Carte d'identité (n° + expiration)","Passeport (n° + expiration)","Permis de conduire (n° + expiration)","Titre de séjour","Téléphone","E-mail principal","Plaque d'immatriculation","Numéro de carte grise"],
"Santé":["Groupe sanguin","Allergies","Maladies / traitements en cours","Médecin traitant","Mutuelle (n° adhérent)","Numéro de carte Vitale","Vaccins et rappels","Médicaments réguliers","Correction lunettes"],
"Contacts":["Contact d'urgence","Famille proche","Employeur / école","Banque (conseiller, opposition CB)","Assurance (n° contrat + sinistre)","Propriétaire / syndic","Électricité (n° contrat)","Eau (n° contrat)","Internet (n° contrat)","Mobile (n° contrat)"],
"Documents":["Où sont rangés mes papiers","Contrat de travail","Bail","Crédit (n° contrat)","Numéro fiscal","Numéro d'allocataire CAF","Numéro France Travail","Carte de transport","Échéance contrôle technique","Échéance assurance","Renouvellement de papiers"],
"Finances":["IBAN compte principal","IBAN compte épargne","BIC","Assurance-vie (n° contrat)","Épargne / retraite (n° contrat)","Crédit en cours (organisme, fin)","Abonnement (nom, prix, date)"],
"Notes":["Taille vêtements","Pointure","Taille de bague","Modèle de téléphone","Numéro IMEI (*#06#)","Consignes pour un proche"]
};
const KEY="coffre_v1";
const enc=new TextEncoder(),dec=new TextDecoder();
let key=null,dek=null,meta=null,pendingCode=null,items=[],cat="Tous",shown=null,timer=null,fails=0,view="list",msg="";

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=b=>{let s="";new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const load=()=>{try{return localStorage.getItem(KEY)}catch(e){return null}};
const store=v=>{try{localStorage.setItem(KEY,v);return true}catch(e){return false}};

const ITP=600000,ITR=100000,ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const newCode=()=>Array.from(rnd(24),x=>ALPH[x&31]).join("");
const normCode=t=>t.toUpperCase().replace(/[^A-Z0-9]/g,"");
const fmt=c=>c.match(/.{4}/g).join("-");
async function derive(pw,sl,it){
  const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:sl,iterations:it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function wrap(secret,it,raw){
  const sl=rnd(16),iv=rnd(12),k=await derive(secret,sl,it);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,raw);
  return {s:b64(sl),i:b64(iv),d:b64(ct)};
}
async function unwrap(secret,it,w){
  const k=await derive(secret,ub(w.s),it);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(w.i)},k,ub(w.d)));
}
const dkey=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);
async function seal(){
  const iv=rnd(12);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(items)));
  return JSON.stringify({v:2,pw:meta.pw,rc:meta.rc,i:b64(iv),d:b64(ct)});
}
async function openBlob(blob,secret,mode){
  const o=JSON.parse(blob);
  if(o.v===2){
    const raw=await unwrap(secret,mode==="rc"?ITR:ITP,o[mode]),k=await dkey(raw);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},k,ub(o.d));
    return {raw,k,items:JSON.parse(dec.decode(pt)),meta:{pw:o.pw,rc:o.rc}};
  }
  if(mode!=="pw")throw 0;
  const k=await derive(secret,ub(o.s),ITP);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},k,ub(o.d));
  return {legacy:true,items:JSON.parse(dec.decode(pt))};
}
async function setupKeys(pw,list){
  dek=rnd(32);key=await dkey(dek);items=list;
  const code=newCode();
  meta={pw:await wrap(pw,ITP,dek),rc:await wrap(code,ITR,dek)};
  await save();return code;
}
async function rotateCode(){const c=newCode();meta.rc=await wrap(c,ITR,dek);await save();return c}
async function save(){if(!store(await seal()))msg="Enregistrement impossible : le stockage du navigateur est bloqué."}

function bindWipe(b,label){
  b.onclick=()=>{
    if(b.dataset.arm!=="1"){
      b.dataset.arm="1";b.textContent="Toucher à nouveau pour tout effacer (irréversible)";
      setTimeout(()=>{b.dataset.arm="";b.textContent=label},5000);return;
    }
    try{localStorage.removeItem(KEY)}catch(e){}
    fails=0;view="list";lock();
  };
}
function lock(){key=null;dek=null;meta=null;pendingCode=null;items=[];shown=null;view="list";render()}
let idle;
function bump(){clearTimeout(idle);if(key&&!pendingCode)idle=setTimeout(lock,60000)}
["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,bump,{passive:true}));
document.addEventListener("visibilitychange",()=>{if(document.hidden&&key&&!pendingCode)lock()});

const EYE='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
function addEyes(){
  const a=document.activeElement;
  document.querySelectorAll('#app input[type="password"]').forEach(inp=>{
    const w=document.createElement("div");w.className="pwwrap";
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    const b=document.createElement("button");
    b.type="button";b.className="eye";b.innerHTML=EYE;b.setAttribute("aria-label","Afficher le mot de passe");
    b.onclick=()=>{
      const show=inp.type==="password";
      inp.type=show?"text":"password";
      b.innerHTML=show?EYEOFF:EYE;
      b.setAttribute("aria-label",show?"Masquer le mot de passe":"Afficher le mot de passe");
    };
    w.appendChild(b);
  });
  if(a&&a.focus&&document.body.contains(a))a.focus();
}
const I=p=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const CI={
"Identité":I('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.6 1.8-2.4 3-2.4s2.4.8 3 2.4M14 10h4M14 14h3"/>'),
"Santé":I('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'),
"Contacts":I('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>'),
"Documents":I('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>'),
"Finances":I('<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>'),
"Notes":I('<path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h4"/>')};
const GRID=I('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>');
const PLUS=I('<path d="M12 5v14M5 12h14"/>');
const SHIELD=I('<path d="M12 3l7 3v5c0 4.6-3 8-7 10-4-2-7-5.4-7-10V6z"/><path d="M9 12l2 2 4-4"/>');
const SAVE=I('<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/>');
const LOCKI=I('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>');
const MINI='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--brass)" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="var(--brass)"/></svg>';
const DIAL='<svg class="dial" viewBox="0 0 120 120" width="124" height="124" aria-hidden="true"><circle cx="60" cy="60" r="57" fill="var(--panel)" stroke="var(--brass)" stroke-width="3"/><g class="ring" stroke="var(--brass)" stroke-width="2.2" stroke-linecap="round">'+Array.from({length:24},(_,k)=>`<line x1="60" y1="9" x2="60" y2="${k%6?14:20}" transform="rotate(${k*15} 60 60)"/>`).join("")+'<circle cx="60" cy="60" r="31" fill="none" stroke-width="1.5"/></g><circle cx="60" cy="60" r="9" fill="var(--brass)"/><rect x="57.5" y="62" width="5" height="14" rx="2" fill="var(--brass)"/><path d="M55 1h10l-5 9z" fill="var(--ink)"/></svg>';
function render(){_render();addEyes();addNav()}
function addNav(){
  let n=document.getElementById("nav");
  const show=key&&["list","add","backup","sec"].includes(view);
  document.body.classList.toggle("hasnav",!!show);
  if(!show){if(n)n.remove();return}
  $("#app").insertAdjacentHTML("afterbegin",`<header class="bar"><span class="brand">${MINI}Mon coffre</span><button class="ico" id="lk" aria-label="Verrouiller">${LOCKI}</button></header>`);
  $("#lk").onclick=lock;
  if(!n){n=document.createElement("nav");n.id="nav";document.body.appendChild(n)}
  n.innerHTML=[["list","Coffre",GRID],["sec","Sécurité",SHIELD],["add","Ajouter",PLUS],["backup","Sauvegarde",SAVE]].map(([v,l,p])=>`<button class="nb${v===view?" on":""}${v==="add"?" fab":""}" data-v="${v}" aria-label="${l}">${p}<span>${l}</span></button>`).join("");
  n.querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;if(view==="list")cat="Tous";render()});
}
function _render(){
  const app=$("#app");
  if(!key&&view==="reset"){
    app.innerHTML=`<h1>Mot de passe oublié</h1>
    <p>Entre ton code de récupération et choisis un nouveau mot de passe.</p>
    <input id="rc" autocomplete="off" autocapitalize="characters" placeholder="Code de récupération">
    <input id="n1" type="password" autocomplete="off" placeholder="Nouveau mot de passe (12 caractères min.)">
    <input id="n2" type="password" autocomplete="off" placeholder="Confirme le nouveau mot de passe">
    <div class="err" id="err" role="alert"></div>
    <div class="row"><button id="ok">Réinitialiser</button><button class="sec" id="bk">Retour</button></div>
    <p class="note" style="margin-top:14px">Sans ton mot de passe ni ton code, les données ne peuvent pas être récupérées : c'est le prix d'un vrai chiffrement.</p>
    <div class="row" style="margin-top:14px"><button class="bad sm" id="wp">Effacer et recréer un coffre</button></div>`;
    bindWipe($("#wp"),"Effacer et recréer un coffre");
    $("#bk").onclick=()=>{view="list";render()};
    $("#ok").onclick=async()=>{
      const e=$("#err"),n1=$("#n1").value;
      if(n1.length<12){e.textContent="Le nouveau mot de passe doit faire au moins 12 caractères.";return}
      if(n1!==$("#n2").value){e.textContent="Les deux mots de passe sont différents.";return}
      e.textContent="Vérification…";
      try{
        const r=await openBlob(load(),normCode($("#rc").value),"rc");
        dek=r.raw;key=r.k;items=r.items;meta=r.meta;
        meta.pw=await wrap(n1,ITP,dek);
        pendingCode=await rotateCode();
        view="reccode";bump();render();
      }catch(x){key=null;dek=null;meta=null;items=[];e.textContent="Code de récupération incorrect."}
    };
    return;
  }
  if(key&&view==="reccode"){
    app.innerHTML=`<h1>Ton code de récupération</h1>
    <p>Écris ce code sur papier et garde-le hors du téléphone. Si tu oublies ton mot de passe, c'est le seul moyen de rouvrir le coffre. Il ne sera plus affiché ensuite.</p>
    <div class="entry" style="font:600 20px/1.7 ui-monospace,monospace;letter-spacing:.06em;text-align:center;word-break:break-all">${fmt(pendingCode)}</div>
    <button id="ok">J'ai noté mon code</button>`;
    $("#ok").onclick=()=>{pendingCode=null;view="list";bump();render()};
    return;
  }
  if(key&&view==="sec"){
    app.innerHTML=`<h1>Sécurité</h1>
    <p>Change ton mot de passe maître. Il faut connaître l'actuel.</p>
    <input id="o" type="password" autocomplete="off" placeholder="Mot de passe actuel">
    <input id="n1" type="password" autocomplete="off" placeholder="Nouveau mot de passe (12 caractères min.)">
    <input id="n2" type="password" autocomplete="off" placeholder="Confirme le nouveau mot de passe">
    <div class="err" id="err" role="alert"></div>
    <button id="chg">Changer le mot de passe</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <p>Le code de récupération permet de rouvrir le coffre si tu oublies ton mot de passe. En générer un nouveau annule l'ancien.</p>
    <button class="sec" id="nc">Générer un nouveau code</button>
    <div class="row" style="margin-top:16px"><button class="sec" id="bk">Retour</button></div>`;
    $("#bk").onclick=()=>{view="list";render()};
    $("#chg").onclick=async()=>{
      const e=$("#err"),n1=$("#n1").value;
      e.style.color="";
      if(n1.length<12){e.textContent="Le nouveau mot de passe doit faire au moins 12 caractères.";return}
      if(n1!==$("#n2").value){e.textContent="Les deux mots de passe sont différents.";return}
      e.textContent="Vérification…";
      try{await unwrap($("#o").value,ITP,meta.pw)}catch(x){e.textContent="Mot de passe actuel incorrect.";return}
      meta.pw=await wrap(n1,ITP,dek);await save();
      ["#o","#n1","#n2"].forEach(q=>$(q).value="");
      e.style.color="var(--ink)";e.textContent="Mot de passe changé.";
    };
    $("#nc").onclick=async()=>{pendingCode=await rotateCode();view="reccode";render()};
    return;
  }
  if(!key){
    const first=!load();
    app.innerHTML=`${DIAL}<h1>Mon coffre</h1>
    <p>${first?"Crée ton mot de passe maître. Il chiffre tout sur ce téléphone. Un code de récupération te sera donné juste après, au cas où tu l'oublies.":"Entre ton mot de passe maître pour ouvrir le coffre."}</p>
    <input id="pw" type="password" autocomplete="off" placeholder="Mot de passe maître">
    ${first?'<input id="pw2" type="password" autocomplete="off" placeholder="Confirme le mot de passe"><p class="note">Au moins 12 caractères. Une phrase de plusieurs mots est idéale.</p>':""}
    <div class="err" id="err" role="alert"></div>
    <button id="go">${first?"Créer le coffre":"Ouvrir"}</button>
    ${first?"":'<div class="row" style="margin-top:18px"><button class="sec sm" id="fg">Mot de passe oublié ?</button><button class="bad sm" id="wp">Effacer et recréer un coffre</button></div><p class="note" style="margin-top:12px">Verrouillage automatique après 1 minute d\'inactivité.</p>'}`;
    $("#go").onclick=()=>first?create():unlock();
    if(!first){$("#fg").onclick=()=>{view="reset";render()};bindWipe($("#wp"),"Effacer et recréer un coffre")}
    $("#pw").focus();
    return;
  }
  if(view==="add"){
    app.innerHTML=`<h1>Nouvelle information</h1>
    <select id="c">${CATS.map(c=>`<option${c===cat?" selected":""}>${c}</option>`).join("")}</select>
    <p class="note" style="margin-bottom:6px">Touche une suggestion, ou écris ton propre nom :</p>
    <div class="row" id="sg" style="margin-bottom:12px"></div>
    <input id="t" placeholder="Nom (ex. Numéro de sécu)">
    <textarea id="v" placeholder="Valeur"></textarea>
    <div class="row"><button id="ok">Enregistrer</button><button class="sec" id="cx">Annuler</button></div>`;
    const drawSug=()=>{
      const used=items.filter(i=>i.c===$("#c").value).map(i=>i.t);
      const l=(SUG[$("#c").value]||[]).filter(s=>!used.includes(s));
      $("#sg").innerHTML=l.length?l.map((s,n)=>`<button class="sec sm" data-n="${n}">${esc(s)}</button>`).join(""):'<span class="note">Toutes les suggestions sont déjà utilisées.</span>';
      $("#sg").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("#t").value=l[b.dataset.n];$("#v").focus()});
    };
    $("#c").onchange=drawSug;drawSug();
    $("#cx").onclick=()=>{view="list";render()};
    $("#ok").onclick=async()=>{
      const t=$("#t").value.trim(),v=$("#v").value;
      if(!t||!v)return;
      items.push({id:crypto.randomUUID(),c:$("#c").value,t,v});
      await save();view="list";render();
    };
    return;
  }
  if(view==="backup"){
    app.innerHTML=`<h1>Sauvegarde</h1>
    <p>La sauvegarde reste chiffrée : sans ton mot de passe maître, elle est illisible. Copie-la dans un endroit sûr.</p>
    <button id="ex">Afficher la sauvegarde chiffrée</button>
    <textarea id="bl" placeholder="Sauvegarde chiffrée" style="margin-top:12px"></textarea>
    <input id="ip" type="password" autocomplete="off" placeholder="Mot de passe de la sauvegarde (pour restaurer)">
    <div class="row"><button class="sec" id="cp">Copier</button><button class="sec" id="im">Restaurer depuis ce texte</button></div>
    <div class="err" id="err" role="alert"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <button class="bad" id="wipe">Effacer tout le coffre</button>
    <div class="row" style="margin-top:16px"><button class="sec" id="bk">Retour</button></div>`;
    $("#bk").onclick=()=>{view="list";render()};
    $("#ex").onclick=async()=>{$("#bl").value=await seal()};
    $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText($("#bl").value)}catch(e){$("#bl").select()}};
    $("#im").onclick=async()=>{
      const pw=$("#ip").value;
      if(!pw){$("#err").textContent="Entre le mot de passe maître de cette sauvegarde.";return}
      try{const r=await openBlob($("#bl").value.trim(),pw,"pw");
        if(r.legacy){pendingCode=await setupKeys(pw,r.items);view="reccode"}
        else{dek=r.raw;key=r.k;items=r.items;meta=r.meta;await save();view="list"}
        render()}
      catch(e){$("#err").textContent="Restauration impossible : texte ou mot de passe incorrect."}
    };
    $("#wipe").onclick=()=>{
      const w=$("#wipe");
      if(w.dataset.arm!=="1"){
        w.dataset.arm="1";w.textContent="Toucher à nouveau pour tout effacer (irréversible)";
        setTimeout(()=>{w.dataset.arm="";w.textContent="Effacer tout le coffre"},5000);return;
      }
      try{localStorage.removeItem(KEY)}catch(e){}
      lock();
    };
    return;
  }
  const cnt=c=>items.filter(i=>i.c===c).length;
  if(cat==="Tous"){
    app.innerHTML=`<h1>Mes rubriques</h1><p>${items.length?items.length+" information"+(items.length>1?"s":"")+" protégée"+(items.length>1?"s":"")+" sur ce téléphone.":"Ton coffre est vide. Touche + pour ajouter ta première information."}</p>
    ${msg?`<div class="err" role="alert">${esc(msg)}</div>`:""}
    <div class="grid">${CATS.map(c=>`<button class="tile" data-cat="${c}"><span class="badge">${CI[c]}</span><b>${c}</b><small>${cnt(c)} élément${cnt(c)>1?"s":""}</small></button>`).join("")}</div>`;
  }else{
    const list=items.filter(i=>i.c===cat);
    app.innerHTML=`<button class="sec sm" id="bk2">‹ Rubriques</button><h1 style="margin-top:14px">${cat}</h1>
    ${list.length?list.map(i=>`<div class="ent"><div class="eh"><span class="badge">${CI[i.c]}</span><b>${esc(i.t)}</b></div>
      <div class="val">${shown===i.id?esc(i.v):"••••••••••"}</div>
      <div class="row"><button class="sec sm" data-show="${i.id}">${shown===i.id?"Masquer":"Afficher"}</button>
      <button class="sec sm" data-copy="${i.id}">Copier</button>
      <button class="bad sm" data-del="${i.id}">Supprimer</button></div></div>`).join(""):`<p>Rien ici pour l'instant. Touche + pour ajouter une information.</p>`}`;
    $("#bk2").onclick=()=>{cat="Tous";render()};
  }
  app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});
  app.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{
    clearTimeout(timer);shown=shown===b.dataset.show?null:b.dataset.show;render();
    if(shown)timer=setTimeout(()=>{shown=null;if(key&&view==="list")render()},10000);
  });
  app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    const it=items.find(x=>x.id===b.dataset.copy);
    try{await navigator.clipboard.writeText(it.v);b.textContent="Copié";setTimeout(()=>navigator.clipboard.writeText("").catch(()=>{}),30000)}catch(e){b.textContent="Échec"}
  });
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Confirmer ?";setTimeout(()=>{b.dataset.arm="";b.textContent="Supprimer"},4000);return}
    items=items.filter(x=>x.id!==b.dataset.del);await save();render();
  });
}

async function create(){
  const p=$("#pw").value,p2=$("#pw2").value,e=$("#err");
  if(p.length<12){e.textContent="Le mot de passe doit faire au moins 12 caractères.";return}
  if(p!==p2){e.textContent="Les deux mots de passe sont différents.";return}
  e.textContent="Chiffrement en cours…";
  pendingCode=await setupKeys(p,[]);view="reccode";bump();render();
}
async function unlock(){
  const e=$("#err"),pw=$("#pw").value;
  if(!pw)return;
  e.textContent="Vérification…";
  if(fails>=3)await new Promise(r=>setTimeout(r,Math.min(30000,1000*2**(fails-3))));
  try{
    const r=await openBlob(load(),pw,"pw");
    const dl=document.querySelector(".dial");if(dl){dl.classList.add("spin");await new Promise(z=>setTimeout(z,650))}
    fails=0;msg="";
    if(r.legacy){pendingCode=await setupKeys(pw,r.items);view="reccode"}
    else{dek=r.raw;key=r.k;items=r.items;meta=r.meta}
    bump();render();
  }catch(x){
    fails++;e.textContent="Mot de passe incorrect.";
  }
}
render();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
