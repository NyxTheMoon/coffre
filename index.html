<html lang="fr">

<style>

.dial{display:block;margin:6px auto 14px}

.val{margin:10px 0 12px;word-break:break-word;white-space:pre-wrap;font-variant-numeric:tabular-nums;letter-spacing:.04em}

.hasnav #bk{display:none}
.meter{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin:-4px 0 4px}
.meter i{display:block;height:100%;width:0;transition:width .2s}
.ml{min-height:20px;margin-bottom:8px}
details.grp{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:2px 14px 6px;margin-bottom:12px}

.grp label.note{display:block;margin:10px 0 4px}
.grp .row{gap:10px}
.dense .ent{padding:10px;margin-bottom:8px}.dense .val{margin:6px 0 8px}.dense .tile{min-height:96px}
.grid.one{grid-template-columns:1fr}
.grid.one .tile{min-height:0;flex-direction:row;align-items:center;gap:12px}

.sect{margin:20px 0 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.ent .ico{width:38px;height:38px;font-size:20px}
@media print{body>*:not(#ps){display:none!important}#ps{display:block!important;background:#fff;color:#000;padding:20px;font:14px/1.6 sans-serif}#ps p{color:#000;margin:0 0 8px}}#ps{display:none}
.pr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.pr:first-of-type{border-top:0}
.grp .pr label{margin:0;flex:1;color:var(--ink);font-size:.95em}
.grp .pr select,.grp .pr input{width:auto;max-width:52%;margin:0;padding:8px 10px;flex:0 0 auto}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;border-top:1px solid var(--line);border-radius:0;padding:13px 2px;font-weight:600;box-shadow:none}
.mi::after{content:"›";color:var(--mute);font-size:1.3em}
.mnu .mi:first-child{border-top:0}
details.grp{padding:0 16px 4px}
details.grp summary{padding:14px 0}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1.5px solid var(--line);border-radius:12px;font-size:14px}

.fld{border-top:1px solid var(--line);padding:8px 0}
</style>
</head>

const KEY="coffre_v1";
const enc=new TextEncoder(),dec=new TextDecoder();
let q="",editId=null,attId=null,hl=null,pendAtt=[],rmAtt=[],tmpFl=[],tmpLk=[],attUrls=[],cleaned=false,shareId=null,redrawFl=()=>{},devs=[],bd=[],homed=false,trash=[],log=[],warnF=null,renC=null,sopen={a:true},lastView="",lastCat="";

const b64=b=>{let s="";new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};

const rnd=n=>crypto.getRandomValues(new Uint8Array(n));

const dkey=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);
async function seal(){
  const iv=rnd(12);

  }
  if(mode!=="pw")throw 0;
  const k=await derive(secret,ub(o.s),ITP);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},k,ub(o.d));

}
async function setupKeys(pw,list){
  dek=rnd(32);key=await dkey(dek);items=list;
  const code=newCode();
  meta={pw:await wrap(pw,ITP,dek),rc:await wrap(code,ITR,dek)};
  await save();return code;
}
async function rotateCode(){const c=newCode();meta.rc=await wrap(c,ITR,dek);await save();return c}
async function save(){if(!store(await seal()))msg="Enregistrement impossible : le stockage du navigateur est bloqué."}

function lock(){if(prefs.clipLock){try{navigator.clipboard.writeText("").catch(()=>{})}catch(e){}}attUrls.forEach(u=>URL.revokeObjectURL(u));attUrls=[];cleaned=false;devs=[];bd=[];homed=false;cats=CATS.slice();trash=[];log=[];renC=null;q="";key=null;dek=null;meta=null;pendingCode=null;items=[];shown=null;view="list";render()}
let idle;
function bump(){clearTimeout(idle);if(key&&!pendingCode)idle=setTimeout(lock,prefs.lock*1000)}
["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,bump,{passive:true}));

const EYE='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
function addEyes(){
  const a=document.activeElement;
  document.querySelectorAll('#app input[type="password"]').forEach(inp=>{
    const w=document.createElement("div");w.className="pwwrap";
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);

const I=p=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

async function create(){
  const p=$("#pw").value,p2=$("#pw2").value,e=$("#err");
  if(p.length<12){e.textContent="Le mot de passe doit faire au moins 12 caractères.";return}
  if(p!==p2){e.textContent="Les deux mots de passe sont différents.";return}
  e.textContent="Chiffrement en cours…";
  pendingCode=await setupKeys(p,[]);view="reccode";bump();render();
}
async function unlock(){
  const e=$("#err"),pw=$("#pw").value;
  if(!pw)return;
  e.textContent="Vérification…";
  if(fails>=3)await new Promise(r=>setTimeout(r,Math.min(30000,1000*2**(fails-3))));
  try{
    const r=await openBlob(load(),pw,"pw");
    const dl=document.querySelector(".dial");if(dl){dl.classList.add("spin");await new Promise(z=>setTimeout(z,650))}
    fails=0;msg="";
    if(r.legacy){pendingCode=await setupKeys(pw,r.items);view="reccode"}
    else{dek=r.raw;key=r.k;items=r.items;meta=r.meta;noteUnlock("pw");await save()}
    bump();render();
  }catch(x){
    fails++;e.textContent="Mot de passe incorrect.";
    const f=getF();f.n=(f.n||0)+1;f.t=Date.now();setF(f);
  }
}
