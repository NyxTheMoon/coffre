<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon coffre</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c1320">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<style>
:root{--bg:#e8ecf1;--card:#f8fafc;--panel:#dde4ec;--ink:#13202f;--mute:#586a7e;--line:#cdd6e0;--acc:#1c3556;--acc-ink:#fff;--brass:#a06c14;--bad:#a8231b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1320;--card:#142033;--panel:#1b2c45;--ink:#e8eef6;--mute:#8da0b8;--line:#263850;--acc:#e0b04f;--acc-ink:#1a1405;--brass:#e0b04f;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0c1320;--card:#142033;--panel:#1b2c45;--ink:#e8eef6;--mute:#8da0b8;--line:#263850;--acc:#e0b04f;--acc-ink:#1a1405;--brass:#e0b04f;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Sora,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 18px 40px}
.hasnav main{padding-bottom:120px}
h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:-.02em;line-height:1.2}
p{margin:0 0 16px;color:var(--mute)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
button{border:0;border-radius:14px;padding:14px 18px;background:var(--acc);color:var(--acc-ink);font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
button.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.pwwrap{position:relative;margin-bottom:10px}
.pwwrap input{margin-bottom:0;padding-right:52px}
.pwwrap .eye{position:absolute;right:4px;top:4px;bottom:4px;width:44px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--mute);border-radius:10px}
.err{color:var(--bad);min-height:22px;margin:0 0 8px}
.note{font-size:14px;color:var(--mute)}
textarea{min-height:90px}
.entry{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.dial{display:block;margin:6px auto 14px}
.dial+h1,.dial+h1+p{text-align:center}
.ring{transform-origin:60px 60px;transition:transform .7s cubic-bezier(.3,.8,.3,1)}
.spin .ring,.dial.spin .ring{transform:rotate(200deg)}
@media (prefers-reduced-motion:reduce){.ring{transition:none}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;margin:-20px -18px 14px;padding:14px 18px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em}
.ico{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:50%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:128px;padding:16px;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:22px;font-weight:400}
.tile b{font-size:17px;margin-top:auto}
.tile small{color:var(--mute);font-size:13px}
.badge{width:44px;height:44px;border-radius:14px;background:var(--panel);color:var(--brass);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ent{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.eh{display:flex;align-items:center;gap:12px}
.eh b{font-weight:600}
.val{margin:10px 0 12px;word-break:break-word;white-space:pre-wrap;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:transparent;color:var(--mute);font-size:12px;font-weight:600;border-radius:12px}
.nb.on{color:var(--ink)}
.nb.on svg{color:var(--brass)}
.nb.fab svg{width:40px;height:40px;padding:8px;margin-top:-20px;background:var(--acc);color:var(--acc-ink);border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.nb.fab.on svg{color:var(--acc-ink)}
.hasnav #bk{display:none}
.meter{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin:-4px 0 4px}
.meter i{display:block;height:100%;width:0;transition:width .2s}
.ml{min-height:20px;margin-bottom:8px}
details.grp{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:2px 14px 6px;margin-bottom:12px}
details.grp summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"+";float:right;color:var(--brass)}
details.grp[open] summary::after{content:"–"}
.grp label.note{display:block;margin:10px 0 4px}
.grp .row{gap:10px}
.dense .ent{padding:10px;margin-bottom:8px}.dense .val{margin:6px 0 8px}.dense .tile{min-height:96px}
.grid.one{grid-template-columns:1fr}
.grid.one .tile{min-height:0;flex-direction:row;align-items:center;gap:12px}
.grid.one .tile b{margin:0;flex:1}
.sect{margin:20px 0 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:10px}
input[type=checkbox]{width:22px;height:22px;margin:0;padding:0;accent-color:var(--brass)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--brass)}
input[type=search]{margin-bottom:14px}
.ent .ico{width:38px;height:38px;font-size:20px}
@media print{body>*:not(#ps){display:none!important}#ps{display:block!important;background:#fff;color:#000;padding:20px;font:14px/1.6 sans-serif}#ps p{color:#000;margin:0 0 8px}}#ps{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const CATS=["Identité","Santé","Contacts","Documents","Finances","Notes"];
let cats=CATS.slice();
const PD={theme:"auto",accent:"brass",lock:60,leave:1,clip:30,reveal:10,mask:1,size:16,sort:"az",dense:0,layout:"grid",recent:1,vib:1,wipe:0,name:"",bk:0};
let prefs=Object.assign({},PD);try{Object.assign(prefs,JSON.parse(localStorage.getItem("coffre_prefs")||"{}"))}catch(e){}
const AC={brass:["#a06c14","#e0b04f"],teal:["#0d7a73","#4fd1c5"],rose:["#b5385a","#f27ba0"],green:["#3a7d2c","#8fd16f"],violet:["#6a48c9","#a99bff"]};
function applyPrefs(){
  const r=document.documentElement,b=document.body;
  if(prefs.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",prefs.theme);
  b.style.fontSize=prefs.size+"px";b.classList.toggle("dense",!!prefs.dense);
  const dark=prefs.theme==="dark"||(prefs.theme==="auto"&&!!window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  ["--brass","--acc","--acc-ink"].forEach(p=>r.style.removeProperty(p));
  if(prefs.accent!=="brass"&&AC[prefs.accent]){const c=AC[prefs.accent][dark?1:0];r.style.setProperty("--brass",c);r.style.setProperty("--acc",c);r.style.setProperty("--acc-ink",dark?"#10151c":"#fff")}
}
try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyPrefs)}catch(e){}
const getF=()=>{try{return JSON.parse(localStorage.getItem("coffre_f")||"{}")}catch(e){return {}}};
const setF=o=>{try{localStorage.setItem("coffre_f",JSON.stringify(o))}catch(e){}};
const vib=()=>{try{if(prefs.vib&&navigator.vibrate)navigator.vibrate(15)}catch(e){}};
function savePrefs(){try{localStorage.setItem("coffre_prefs",JSON.stringify(prefs))}catch(e){}applyPrefs()}
function pdata(pt){const d=JSON.parse(dec.decode(pt));if(Array.isArray(d)){cats=CATS.slice();trash=[];log=[];return d}cats=d.cats&&d.cats.length?d.cats:CATS.slice();trash=(d.trash||[]).filter(t=>Date.now()-t.dt<2592e6);log=d.log||[];return d.items||[]}
const SUG={
"Identité":["Nom complet","Nom de naissance","Date de naissance","Lieu de naissance","Nationalité","Adresse actuelle","Numéro de sécurité sociale","Carte d'identité (n° + expiration)","Passeport (n° + expiration)","Permis de conduire (n° + expiration)","Titre de séjour","Téléphone","E-mail principal","Plaque d'immatriculation","Numéro de carte grise"],
"Santé":["Groupe sanguin","Allergies","Maladies / traitements en cours","Médecin traitant","Mutuelle (n° adhérent)","Numéro de carte Vitale","Vaccins et rappels","Médicaments réguliers","Correction lunettes"],
"Contacts":["Contact d'urgence","Famille proche","Employeur / école","Banque (conseiller, opposition CB)","Assurance (n° contrat + sinistre)","Propriétaire / syndic","Électricité (n° contrat)","Eau (n° contrat)","Internet (n° contrat)","Mobile (n° contrat)"],
"Documents":["Où sont rangés mes papiers","Contrat de travail","Bail","Crédit (n° contrat)","Numéro fiscal","Numéro d'allocataire CAF","Numéro France Travail","Carte de transport","Échéance contrôle technique","Échéance assurance","Renouvellement de papiers"],
"Finances":["IBAN compte principal","IBAN compte épargne","BIC","Assurance-vie (n° contrat)","Épargne / retraite (n° contrat)","Crédit en cours (organisme, fin)","Abonnement (nom, prix, date)"],
"Notes":["Taille vêtements","Pointure","Taille de bague","Modèle de téléphone","Numéro IMEI (*#06#)","Consignes pour un proche"]
};
const KEY="coffre_v1";
const enc=new TextEncoder(),dec=new TextDecoder();
let q="",editId=null,trash=[],log=[],warnF=null,renC=null,sopen={a:true},lastView="",lastCat="";
let key=null,dek=null,meta=null,pendingCode=null,items=[],cat="Tous",shown=null,timer=null,fails=0,view="list",msg="";

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=b=>{let s="";new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const load=()=>{try{return localStorage.getItem(KEY)}catch(e){return null}};
const store=v=>{try{localStorage.setItem(KEY,v);return true}catch(e){return false}};

const ITP=600000,ITR=100000,ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const newCode=()=>Array.from(rnd(24),x=>ALPH[x&31]).join("");
const normCode=t=>t.toUpperCase().replace(/[^A-Z0-9]/g,"");
const fmt=c=>c.match(/.{4}/g).join("-");
async function derive(pw,sl,it){
  const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:sl,iterations:it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function wrap(secret,it,raw){
  const sl=rnd(16),iv=rnd(12),k=await derive(secret,sl,it);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,raw);
  return {s:b64(sl),i:b64(iv),d:b64(ct)};
}
async function unwrap(secret,it,w){
  const k=await derive(secret,ub(w.s),it);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(w.i)},k,ub(w.d)));
}
const dkey=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);
async function seal(){
  const iv=rnd(12);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify({items,cats,trash,log})));
  return JSON.stringify({v:2,pw:meta.pw,rc:meta.rc,i:b64(iv),d:b64(ct)});
}
async function openBlob(blob,secret,mode){
  const o=JSON.parse(blob);
  if(o.v===2){
    const raw=await unwrap(secret,mode==="rc"?ITR:ITP,o[mode]),k=await dkey(raw);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},k,ub(o.d));
    return {raw,k,items:pdata(pt),meta:{pw:o.pw,rc:o.rc}};
  }
  if(mode!=="pw")throw 0;
  const k=await derive(secret,ub(o.s),ITP);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},k,ub(o.d));
  return {legacy:true,items:pdata(pt)};
}
async function setupKeys(pw,list){
  dek=rnd(32);key=await dkey(dek);items=list;
  const code=newCode();
  meta={pw:await wrap(pw,ITP,dek),rc:await wrap(code,ITR,dek)};
  await save();return code;
}
async function rotateCode(){const c=newCode();meta.rc=await wrap(c,ITR,dek);await save();return c}
async function save(){if(!store(await seal()))msg="Enregistrement impossible : le stockage du navigateur est bloqué."}

function lock(){cats=CATS.slice();trash=[];log=[];renC=null;q="";key=null;dek=null;meta=null;pendingCode=null;items=[];shown=null;view="list";render()}
let idle;
function bump(){clearTimeout(idle);if(key&&!pendingCode)idle=setTimeout(lock,prefs.lock*1000)}
["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,bump,{passive:true}));
document.addEventListener("visibilitychange",()=>{if(document.hidden&&key&&!pendingCode&&prefs.leave&&!window.bioBusy)lock()});

const EYE='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
function addEyes(){
  const a=document.activeElement;
  document.querySelectorAll('#app input[type="password"]').forEach(inp=>{
    const w=document.createElement("div");w.className="pwwrap";
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    const b=document.createElement("button");
    b.type="button";b.className="eye";b.innerHTML=EYE;b.setAttribute("aria-label","Afficher le mot de passe");
    b.onclick=()=>{
      const show=inp.type==="password";
      inp.type=show?"text":"password";
      b.innerHTML=show?EYEOFF:EYE;
      b.setAttribute("aria-label",show?"Masquer le mot de passe":"Afficher le mot de passe");
    };
    w.appendChild(b);
  });
  if(a&&a.focus&&document.body.contains(a))a.focus();
}
const I=p=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const CI={
"Identité":I('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.6 1.8-2.4 3-2.4s2.4.8 3 2.4M14 10h4M14 14h3"/>'),
"Santé":I('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'),
"Contacts":I('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>'),
"Documents":I('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>'),
"Finances":I('<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>'),
"Notes":I('<path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h4"/>')};
const GRID=I('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>');
const PLUS=I('<path d="M12 5v14M5 12h14"/>');
const SHIELD=I('<path d="M12 3l7 3v5c0 4.6-3 8-7 10-4-2-7-5.4-7-10V6z"/><path d="M9 12l2 2 4-4"/>');
const SAVE=I('<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/>');
const LOCKI=I('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>');
const MINI='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--brass)" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="var(--brass)"/></svg>';
const DIAL='<svg class="dial" viewBox="0 0 120 120" width="124" height="124" aria-hidden="true"><circle cx="60" cy="60" r="57" fill="var(--panel)" stroke="var(--brass)" stroke-width="3"/><g class="ring" stroke="var(--brass)" stroke-width="2.2" stroke-linecap="round">'+Array.from({length:24},(_,k)=>`<line x1="60" y1="9" x2="60" y2="${k%6?14:20}" transform="rotate(${k*15} 60 60)"/>`).join("")+'<circle cx="60" cy="60" r="31" fill="none" stroke-width="1.5"/></g><circle cx="60" cy="60" r="9" fill="var(--brass)"/><rect x="57.5" y="62" width="5" height="14" rx="2" fill="var(--brass)"/><path d="M55 1h10l-5 9z" fill="var(--ink)"/></svg>';
const FOLDER=I('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>');
const GEAR=I('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>');
const ci=c=>CI[c]||FOLDER;
const dleft=i=>Math.ceil((new Date(i.x)-Date.now())/864e5);
const exp=i=>{if(!i.x)return null;const d=dleft(i);return d<0?{t:"Expiré",col:"var(--bad)"}:d<=60?{t:"Expire dans "+d+" j",col:"var(--brass)"}:{t:"Expire le "+i.x.split("-").reverse().join("/"),col:"var(--mute)"}};
const SORTS={az:(a,b)=>a.t.localeCompare(b.t,"fr"),za:(a,b)=>b.t.localeCompare(a.t,"fr"),new:(a,b)=>(b.d||0)-(a.d||0),old:(a,b)=>(a.d||0)-(b.d||0)};
const sortItems=l=>l.slice().sort(SORTS[prefs.sort]||SORTS.az);
const twoTap=(b,lab,fn)=>{b.onclick=()=>{if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Confirmer ?";setTimeout(()=>{b.dataset.arm="";b.textContent=lab},4000);return}fn()}};
const dl=(n,t,x)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([x],{type:t}));a.download=n;document.body.appendChild(a);a.click();a.remove()};
const ics=l=>{const n=new Date().toISOString().replace(/[-:]|\.\d+/g,"");return "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Mon coffre//FR\r\n"+l.map(i=>{const d=new Date(i.x+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+1);return "BEGIN:VEVENT\r\nUID:"+i.id+"@coffre\r\nDTSTAMP:"+n+"\r\nDTSTART;VALUE=DATE:"+i.x.replace(/-/g,"")+"\r\nDTEND;VALUE=DATE:"+d.toISOString().slice(0,10).replace(/-/g,"")+"\r\nSUMMARY:"+i.t.replace(/[\\;,\n]/g," ")+"\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Echeance\r\nTRIGGER:-P7D\r\nEND:VALARM\r\nEND:VEVENT\r\n"}).join("")+"END:VCALENDAR\r\n"};
function printSheet(l){const d=document.createElement("div");d.id="ps";d.innerHTML="<h1>Fiche d'urgence</h1>"+l.map(i=>`<p><b>${esc(i.t)}</b> : ${esc(i.v)}</p>`).join("");document.body.appendChild(d);window.print();setTimeout(()=>d.remove(),800)}
const BK="coffre_bio",bioOn=()=>{try{return !!localStorage.getItem(BK)}catch(e){return false}};
const bioGet=async(id,salt)=>{const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:"public-key",id}],userVerification:"required",timeout:60000,extensions:{prf:{eval:{first:salt}}}}});const p=a.getClientExtensionResults().prf;if(!p||!p.results||!p.results.first)throw 0;return crypto.subtle.importKey("raw",p.results.first,"AES-GCM",false,["encrypt","decrypt"])};
async function bioEnable(){
  const m=$("#bioM");window.bioBusy=true;
  try{
    if(!window.PublicKeyCredential||!dek)throw 1;
    const c=await navigator.credentials.create({publicKey:{rp:{name:"Mon coffre",id:location.hostname},user:{id:rnd(16),name:"coffre",displayName:"Mon coffre"},challenge:rnd(32),pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000,extensions:{prf:{}}}});
    if(!(c.getClientExtensionResults().prf||{}).enabled)throw 2;
    const salt=rnd(32),k=await bioGet(c.rawId,salt),iv=rnd(12);
    const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,dek);
    localStorage.setItem(BK,JSON.stringify({id:b64(c.rawId),s:b64(salt),i:b64(iv),d:b64(ct)}));
    setTimeout(()=>{window.bioBusy=false},1500);render();
  }catch(e){setTimeout(()=>{window.bioBusy=false},1500);const mm=$("#bioM");if(mm)mm.textContent=e===2?"Pas pris en charge ici. Sur Android : ouvre l'appli dans Chrome, connecté à un compte Google, avec un verrouillage d'écran. Sinon, utilise le code court.":"Activation impossible ou annulée (il faut ouvrir l'appli en https)."}
}
async function bioUnlock(){
  const e=$("#err");window.bioBusy=true;
  try{
    const b=JSON.parse(localStorage.getItem(BK)),k=await bioGet(ub(b.id),ub(b.s));
    const raw=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(b.i)},k,ub(b.d)));
    const o=JSON.parse(load()),dk=await dkey(raw);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},dk,ub(o.d));
    const dd=document.querySelector(".dial");if(dd){dd.classList.add("spin");await new Promise(z=>setTimeout(z,650))}
    dek=raw;key=dk;items=pdata(pt);meta={pw:o.pw,rc:o.rc};fails=0;msg="";
    const f=getF();if(f.n)warnF=f;setF({});log.unshift({t:Date.now()});log=log.slice(0,10);await save();
    setTimeout(()=>{window.bioBusy=false},1500);bump();render();
  }catch(x){setTimeout(()=>{window.bioBusy=false},1500);if(e)e.textContent="Empreinte / visage non reconnu : utilise ton mot de passe."}
}
const PK="coffre_pin",pinOn=()=>{try{return !!localStorage.getItem(PK)}catch(e){return false}};
async function openWithDek(raw){
  const o=JSON.parse(load()),dk=await dkey(raw);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},dk,ub(o.d));
  dek=raw;key=dk;items=pdata(pt);meta={pw:o.pw,rc:o.rc};fails=0;msg="";
  const f=getF();if(f.n)warnF=f;setF({});log.unshift({t:Date.now()});log=log.slice(0,10);await save();bump();render();
}
async function pinEnable(){
  const v=$("#pn").value,m=$("#bioM");
  if(!/^\d{6,10}$/.test(v)){m.textContent="Le code court doit faire 6 à 10 chiffres.";return}
  m.textContent="Chiffrement en cours…";
  try{localStorage.setItem(PK,JSON.stringify({w:await wrap(v,ITP,dek),n:0}));render()}catch(e){m.textContent="Activation impossible."}
}
async function pinUnlock(){
  const e=$("#err"),v=$("#pk").value;if(!v)return;
  let p;try{p=JSON.parse(localStorage.getItem(PK))}catch(x){return}
  e.textContent="Vérification…";
  try{await openWithDek(await unwrap(v,ITP,p.w))}
  catch(x){
    p.n=(p.n||0)+1;const left=5-p.n;
    if(left<=0){try{localStorage.removeItem(PK)}catch(y){}render();$("#err").textContent="Trop d'essais : le code court est désactivé. Utilise ton mot de passe."}
    else{try{localStorage.setItem(PK,JSON.stringify(p))}catch(y){}e.textContent="Code court incorrect ("+left+" essai"+(left>1?"s":"")+" restant"+(left>1?"s":"")+")."}
  }
}

function score(p){let v=0;if(p.length>=12)v++;if(p.length>=16)v++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))v++;if(/\d/.test(p))v++;if(/[^A-Za-z0-9]/.test(p))v++;if(new Set(p).size<5)v=Math.min(v,1);return Math.min(v,4)}
function addMeters(){
  const L=["Très faible","Faible","Moyen","Fort","Très fort"],C=["var(--bad)","var(--bad)","var(--brass)","var(--brass)","var(--brass)"];
  [["#pw","#pw2"],["#n1",null]].forEach(([a,b])=>{
    const inp=$(a);if(!inp||(b&&!$(b)))return;
    const w=inp.closest(".pwwrap")||inp,m=document.createElement("div");
    m.innerHTML='<div class="meter"><i></i></div><div class="note ml"></div>';w.after(m);
    const up=()=>{const sc=inp.value?score(inp.value):-1,i=m.querySelector("i");i.style.width=sc<0?"0":(sc+1)*20+"%";i.style.background=C[Math.max(sc,0)];m.querySelector(".ml").textContent=sc<0?"":"Solidité : "+L[sc]};
    inp.addEventListener("input",up);up();

function bindEnt(box){

  box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});
  box.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{
    clearTimeout(timer);shown=shown===b.dataset.show?null:b.dataset.show;render();
    if(shown)timer=setTimeout(()=>{shown=null;if(key&&view==="list")render()},prefs.reveal*1000);
  });
  box.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    const it=items.find(x=>x.id===b.dataset.copy);
    try{await navigator.clipboard.writeText(it.v);vib();b.textContent="Copié";if(prefs.clip)setTimeout(()=>navigator.clipboard.writeText("").catch(()=>{}),prefs.clip*1000)}catch(e){b.textContent="Échec"}
  });

  box.querySelectorAll("[data-dw]").forEach(b=>b.onclick=()=>{warnF=null;render()});
  box.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editId=b.dataset.edit;view="edit";render()});

  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Confirmer ?";setTimeout(()=>{b.dataset.arm="";b.textContent="Supprimer"},4000);return}

}

    $("#ac").onclick=async()=>{const n=$("#nc2").value.trim();if(!n||cats.includes(n))return;cats.push(n);await save();render()};

}

function addNav(){

  const act={backup:"set",gen:"set",trash:"set",bulk:"set",stats:"set",log:"set",edit:"list",urg:"list"}[view]||view;
  document.body.classList.toggle("hasnav",!!show);

  $("#app").insertAdjacentHTML("afterbegin",`<header class="bar"><span class="brand">${MINI}${esc(prefs.name||"Mon coffre")}</span><button class="ico" id="lk" aria-label="Verrouiller">${LOCKI}</button></header>`);
  $("#lk").onclick=()=>{vib();lock()};
  if(!n){n=document.createElement("nav");n.id="nav";document.body.appendChild(n)}

async function create(){
  const p=$("#pw").value,p2=$("#pw2").value,e=$("#err");
  if(p.length<12){e.textContent="Le mot de passe doit faire au moins 12 caractères.";return}
  if(p!==p2){e.textContent="Les deux mots de passe sont différents.";return}
  e.textContent="Chiffrement en cours…";
  pendingCode=await setupKeys(p,[]);view="reccode";bump();render();
}
async function unlock(){
  const e=$("#err"),pw=$("#pw").value;
  if(!pw)return;
  e.textContent="Vérification…";
  if(fails>=3)await new Promise(r=>setTimeout(r,Math.min(30000,1000*2**(fails-3))));
  try{
    const r=await openBlob(load(),pw,"pw");
    const dl=document.querySelector(".dial");if(dl){dl.classList.add("spin");await new Promise(z=>setTimeout(z,650))}
    fails=0;msg="";
    if(r.legacy){pendingCode=await setupKeys(pw,r.items);view="reccode"}
    else{dek=r.raw;key=r.k;items=r.items;meta=r.meta;const f=getF();if(f.n)warnF=f;setF({});log.unshift({t:Date.now()});log=log.slice(0,10);await save()}
    bump();render();
  }catch(x){
    fails++;e.textContent="Mot de passe incorrect.";
    const f=getF();f.n=(f.n||0)+1;f.t=Date.now();setF(f);
  }
}
